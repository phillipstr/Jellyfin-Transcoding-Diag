[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jellyfin-transcode-diag"
version = "0.1.0"
description = "Diagnose failed or struggling Jellyfin transcodes from their FFmpeg logs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Conversion",
]

[project.urls]
Homepage = "https://github.com/phillipstr/Jellyfin-Transcoding-Diag"

[project.scripts]
jf-transcode-diag = "jellyfin_transcode_diag.cli:main"
jftd = "jellyfin_transcode_diag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
